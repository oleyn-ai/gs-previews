/* gsadmin-v2 tokens, verbatim from web/apps/admin/tailwind.config.ts:
   brand #7a1220 (hover #5f0e19) · accent #c9962e · surface-muted #f5f0e8 ·
   border #e9e1d4 · ink #26211f / soft #6f6659 · serif = Fraunces (h1 only) */
:root{--pg:#f5f0e8;--cd:#FFF;--ln:#e9e1d4;--tx:#26211f;--t2:#26211f;--t3:#6f6659;--t4:#a5988a;
--mr:#7a1220;--mr2:#5f0e19;--mr50:#f6e7e6;--gd:#c9962e;--ok:#1F7A4D;--okb:#EDF8F2;--okl:#BFE0CD;
--wn:#A66A12;--wnb:#FBF3E2;--wnl:#EBD5A6;--rd:#A32B26;--rdb:#FAE8E6;--rdl:#EFC2BD;
--sh:0 1px 2px rgba(60,40,20,.05),0 8px 24px -10px rgba(60,40,20,.10)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pg:#141010;--cd:#221C1B;--ln:#382F2E;--tx:#F5F1EF;--t2:#E6DEDB;--t3:#A29591;--t4:#7A6E6B;
--mr50:#3A1F26;--okb:#16261D;--okl:#2C4C3A;--wnb:#2A2116;--wnl:#4C3B20;--rdb:#2E1817;--rdl:#553130;--sh:0 1px 3px rgba(0,0,0,.45)}}
:root[data-theme=dark]{--pg:#141010;--cd:#221C1B;--ln:#382F2E;--tx:#F5F1EF;--t2:#E6DEDB;--t3:#A29591;--t4:#7A6E6B;
--mr50:#3A1F26;--okb:#16261D;--okl:#2C4C3A;--wnb:#2A2116;--wnl:#4C3B20;--rdb:#2E1817;--rdl:#553130;--sh:0 1px 3px rgba(0,0,0,.45)}
:root[data-theme=light]{--pg:#f5f0e8;--cd:#FFF;--ln:#e9e1d4;--tx:#26211f;--t2:#26211f;--t3:#6f6659;--t4:#a5988a;
--mr50:#f6e7e6;--okb:#EDF8F2;--okl:#BFE0CD;--wnb:#FBF3E2;--wnl:#EBD5A6;--rdb:#FAE8E6;--rdl:#EFC2BD;
--sh:0 1px 2px rgba(60,40,20,.05),0 8px 24px -10px rgba(60,40,20,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--pg);color:var(--tx);display:flex;flex-direction:column;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 11px;
border-bottom:1px solid var(--ln);background:var(--cd);z-index:400}
.gp{display:flex;gap:3px;padding:3px;background:var(--pg);border-radius:999px}
.tb{appearance:none;border:0;background:none;color:var(--t3);font:inherit;font-size:11.5px;font-weight:650;
padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--mr);color:#fff}
.tb:focus-visible{outline:2px solid var(--mr);outline-offset:2px}
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;overflow:hidden}

.bdot{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 8px;
border-radius:999px;background:var(--okb);color:var(--ok);border:1px solid var(--okl);white-space:nowrap}
.bdot i{width:6px;height:6px;border-radius:50%;background:currentColor}
.bdot.w{background:var(--wnb);color:var(--wn);border-color:var(--wnl)}
.bdot.r{background:var(--rdb);color:var(--rd);border-color:var(--rdl)}
.bdot.m{background:var(--mr50);color:var(--mr);border-color:transparent}
.bdot.n{background:var(--pg);color:var(--t3);border-color:var(--ln)}
:root[data-theme=dark] .bdot.m{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bdot.m{color:#EBA3AF}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bdot.live i{animation:pulse 1.6s ease infinite}

.web{width:100%;height:100%;display:grid;grid-template-columns:206px 1fr 300px;overflow:hidden}
.web.np{grid-template-columns:206px 1fr}
@media(max-width:1040px){.web,.web.np{grid-template-columns:1fr}.sb,.xr{display:none}}
/* sidebar wears the real gsadmin chrome: brand maroon, white nav, gold active bar */
.sb{padding:18px 12px;background:var(--mr);overflow:auto}
.lgw{padding:2px 10px 18px}
.lgw .wm{display:block;font-family:Fraunces,ui-serif,Georgia,serif;font-size:19px;font-weight:700;
color:#fff;letter-spacing:-.01em;line-height:22px}
.lgw .adm{display:block;font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
color:var(--gd);margin-top:3px}
.gl{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.45);
padding:14px 10px 5px;display:flex;align-items:center;gap:5px}
.gl svg{width:11px;height:11px;flex:0 0 auto}
.sb a{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500;
color:rgba(255,255,255,.82);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
.sb a svg{width:16px;height:16px;flex:0 0 auto;color:rgba(255,255,255,.55)}
.sb a[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;font-weight:650;border-left-color:var(--gd)}
.sb a[aria-current=page] svg{color:var(--gd)}
.sb a .ct{margin-left:auto;font-size:10px;font-weight:700;background:var(--gd);color:#3d2c07;
padding:1px 7px;border-radius:999px}
.sb a.dis{color:rgba(255,255,255,.38);cursor:default}
.sb a.dis svg{color:rgba(255,255,255,.3)}
.sb a.dis .hint{margin-left:auto;font-size:10px;color:rgba(255,255,255,.38)}
.mn{overflow:auto;padding:18px 22px 40px}
.h1{font-family:Fraunces,ui-serif,Georgia,serif;font-size:23px;font-weight:700;letter-spacing:-.01em;margin:0}
.h2{font-size:12px;color:var(--t3);margin:3px 0 0}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.mcs{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:1280px){.mcs{grid-template-columns:repeat(2,1fr)}}
.mc{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.fi2{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;
background:var(--mr50);color:var(--mr)}
.fi2.g{background:var(--okb);color:var(--ok)}.fi2.a{background:var(--wnb);color:var(--wn)}
.fi2.rr{background:var(--rdb);color:var(--rd)}
.fi2 svg{width:15px;height:15px}
.mc b{font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;line-height:24px}
.mc span{font-size:11px;color:var(--t3);font-weight:600}

.tbl{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--cd)}
.thd{display:flex;gap:12px;padding:8px 13px;border-bottom:1px solid var(--ln);background:var(--pg);
font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t4)}
.rw{display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--ln);transition:background .1s}
.rw:hover{background:var(--pg)}
.rw:last-child{border-bottom:0}
.wb{height:30px;padding:0 11px;border-radius:8px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;border:none;
display:inline-flex;align-items:center;gap:5px}
.wb svg{width:13px;height:13px}
.wb.pri{background:var(--mr);color:#fff}
.wb.gh{background:transparent;border:1px solid var(--ln);color:var(--t2)}
.wb.grn{background:var(--ok);color:#fff}
.wb:disabled{background:var(--ln);color:var(--t4);cursor:not-allowed;border:none}
.btnp{transition:transform .09s ease}.btnp:not(:disabled):active{transform:scale(.95)}

/* slot pipeline */
.slot{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.slot .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.slot .tt{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.slot .sub{font-size:11.5px;color:var(--t3);margin-left:auto;font-weight:550}
.trk{flex:0 0 auto;height:5px;border-radius:999px;background:var(--ln);overflow:hidden;width:100%;margin:10px 0 8px}
.trk i{display:block;height:100%;background:var(--ok);border-radius:999px}
.stgs{display:flex;gap:4px;flex-wrap:wrap}
.stg{font-size:10px;font-weight:650;padding:3px 8px;border-radius:999px;background:var(--pg);color:var(--t4);
border:1px solid var(--ln);display:inline-flex;align-items:center;gap:4px}
.stg svg{width:10px;height:10px}
.stg.done{background:var(--okb);color:var(--ok);border-color:var(--okl)}
.stg.cur{background:var(--mr);color:#fff;border-color:var(--mr);font-weight:700}

/* exceptions rail */
.xr{border-left:1px solid var(--ln);background:var(--cd);overflow:auto;padding:16px 13px}
.xr h5{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--t4);
margin:0 0 10px;display:flex;align-items:center;gap:6px}
.xr h5 svg{width:13px;height:13px}
.xc{border:1px solid var(--ln);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:var(--cd)}
.xc.warn{border-color:var(--wnl);background:var(--wnb)}
.xc.crit{border-color:var(--rdl);background:var(--rdb)}
.xc .ti{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700}
.xc .ti svg{width:14px;height:14px;flex:0 0 auto}
.xc.warn .ti{color:var(--wn)}.xc.crit .ti{color:var(--rd)}
.xc .ag{margin-left:auto;font-size:10px;font-weight:650;color:var(--t4)}
.xc p{margin:5px 0 9px;font-size:12px;line-height:17px;color:var(--t2)}
.xc .ac{display:flex;gap:6px;flex-wrap:wrap}
.xc.ok2{border-color:var(--okl);background:var(--okb);display:flex;align-items:center;gap:8px;
font-size:12px;font-weight:650;color:var(--ok)}
.xc.ok2 svg{width:14px;height:14px}

/* phone (runner) — no scrollbar in frame, true proportions */
.ph{width:100%;height:100%;background:var(--pg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:530px){
 .stage.phst{padding:14px;overflow:hidden;align-items:center;justify-content:center}
 .ph{width:393px;height:852px;flex:0 0 auto;border-radius:44px;
   box-shadow:0 0 0 9px #1a1414,0 0 0 10px #3a3230,0 22px 50px rgba(28,23,23,.3)}
}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar{display:none;width:0;height:0}
.sbar{flex:0 0 auto;height:52px;background:var(--mr);display:flex;align-items:center;
justify-content:space-between;padding:14px 30px 0;position:relative;color:#fff;font-size:14px;font-weight:650}
.isl{position:absolute;left:50%;transform:translateX(-50%);top:9px;width:112px;height:31px;border-radius:999px;background:#100c0c}
.bat{width:22px;height:11px;border:1.4px solid rgba(255,255,255,.7);border-radius:3px;position:relative;display:inline-block}
.bat i{position:absolute;inset:1.5px;width:65%;background:#fff;border-radius:1px;display:block}
@media(max-width:529px){.sbar{display:none}}
.hd{flex:0 0 auto;background:var(--mr);padding:6px 18px 15px;display:flex;align-items:center;gap:11px}
.hd img{width:38px;height:38px;border-radius:50%;background:#fff;flex:0 0 auto}
.hd .st{font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase}
.hd .wv{font-size:19px;font-weight:700;letter-spacing:-.02em;color:#fff;margin-top:2px}
.prog{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--cd);border-bottom:1px solid var(--ln)}
.tr2{flex:1;height:5px;border-radius:999px;background:var(--ln);overflow:hidden}
.tr2 i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.pc{font-size:11.5px;font-weight:650;color:var(--t3);white-space:nowrap}
.list{padding:12px;display:flex;flex-direction:column;gap:8px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.c.done{background:var(--okb);border-color:var(--okl);box-shadow:none}
.c .r1{display:flex;align-items:center;gap:10px}
.wo{width:26px;height:26px;border-radius:50%;background:var(--mr50);color:var(--mr);font-size:12px;font-weight:700;
display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.c.done .wo{background:rgba(31,122,77,.14);color:var(--ok)}
.c b.nm{font-size:14.5px;font-weight:650;letter-spacing:-.01em}
.c .sub2{font-size:11.5px;color:var(--t3);font-weight:550;margin-top:1px}
.cbt{margin-left:auto;flex:0 0 auto;height:38px;padding:0 15px;border-radius:10px;border:0;font:inherit;
font-size:13px;font-weight:650;cursor:pointer;background:var(--ok);color:#fff}
.cbt.g{background:transparent;border:1.5px solid var(--okl);color:var(--ok);cursor:default}
.fa{flex:0 0 auto;padding:8px 12px 24px;background:var(--cd);border-top:1px solid var(--ln);text-align:center}
.fa p{margin:0;font-size:11px;color:var(--t4);font-weight:550}
.hbar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:132px;height:4.5px;
border-radius:999px;background:var(--t4);opacity:.55}

/* object threads — private notes pinned to the thing itself */
.thr{margin-top:9px;border-top:1px dashed var(--ln);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:92%;border-radius:10px;padding:7px 10px;font-size:12px;line-height:16px;
background:var(--cd);border:1px solid var(--ln);color:var(--t2);align-self:flex-start}
.bub .who{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
margin-bottom:2px;color:var(--t4)}
.bub.of{align-self:flex-end;background:var(--mr50);border-color:transparent}
.bub.of .who{color:var(--mr)}
.bub.rn .who{color:var(--wn)}
:root[data-theme=dark] .bub.of .who{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bub.of .who{color:#EBA3AF}}
.tin{display:flex;gap:6px;margin-top:2px}
.tin input{flex:1;height:34px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);
padding:0 10px;font:inherit;font-size:12.5px;outline:0;color:var(--tx);min-width:0}
.tin button{height:34px;padding:0 13px;border-radius:8px;border:0;background:var(--mr);color:#fff;
font:inherit;font-size:12px;font-weight:650;cursor:pointer}
.plock{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t4);font-weight:600;margin-top:2px}
.plock svg{width:11px;height:11px;flex:0 0 auto}
.chipflt{display:flex;gap:5px;flex-wrap:wrap}
.cf{font-size:11px;font-weight:650;padding:5px 11px;border-radius:999px;border:1px solid var(--ln);
background:var(--cd);color:var(--t3);cursor:pointer}
.cf[aria-pressed=true]{background:var(--mr);border-color:var(--mr);color:#fff}
.mini2{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--pg);
border:1px solid var(--ln);color:var(--t3);white-space:nowrap}
.mini2.in{background:var(--okb);border-color:var(--okl);color:var(--ok)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function fitPhone(){
 var p=document.querySelector('.ph');if(!p)return;
 if(window.innerWidth<530){p.style.zoom='';return}
 var st=document.getElementById('stage');
 var s=Math.min(1,(st.clientHeight-52)/852,(st.clientWidth-52)/393);
 p.style.zoom=s>0?s:1;
}
function render(){
 var el=document.getElementById('stage');
 el.className='stage'+(S.view==='runner'?' phst':'');
 if(S.view!=='runner'&&!can(S.wpage))S.wpage=ALLOW[S.view][0];
 el.innerHTML=S.view==='runner'?runner():ops();
 document.querySelectorAll('[data-v]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S.view)});
 thBtn.setAttribute('aria-pressed',S.dark);
 fitPhone();
}
window.addEventListener('resize',fitPhone);
function refocus(id){var el=document.getElementById(id);
 if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
document.addEventListener('input',function(e){
 var ds=e.target.dataset||{};
 if(ds.tid!==undefined){S.tin[ds.tid]=e.target.value;render();refocus(e.target.id)}
 else if(ds.pid!==undefined){S.pin[ds.pid]=e.target.value.replace(/[^0-9.]/g,'');render();refocus(e.target.id)}
 else if(ds.snote!==undefined){S.snote[ds.snote]=e.target.value;render();refocus(e.target.id)}
});
document.addEventListener('change',function(e){
 var ds=e.target.dataset||{};
 if(ds.pf!==undefined&&e.target.files&&e.target.files[0]){
  var i=ds.pf,fr=new FileReader();
  fr.onload=function(){S.pfd[i]=fr.result;render()};
  fr.readAsDataURL(e.target.files[0]);
 }
 else if(ds.vasel!==undefined){S.vasel[ds.vasel]=e.target.value}
});
document.addEventListener('click',function(e){
 var t=e.target.closest('button,a[data-wp]');if(!t)return;var d=t.dataset;
 if(d.v){S.view=d.v}
 else if(t.id==='thBtn'){S.dark=!S.dark;document.documentElement.setAttribute('data-theme',S.dark?'dark':'light')}
 else if(d.wp){S.wpage=d.wp;S.view='ops'}
 else if(d.flt){S.flt=d.flt}
 else if(d.xa){var p=d.xa.split(':');S.x[p[0]]=p[1]}
