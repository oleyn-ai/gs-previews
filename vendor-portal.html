<title>Geylang Serai — Vendor Portal</title>
<style>
:root{--pg:#FAF8F7;--cd:#FFF;--ln:#EDE8E3;--tx:#1C1717;--t2:#2E2826;--t3:#857A75;--t4:#B0A6A0;
--mr:#8B1A2B;--mr2:#6D1420;--mr50:#FBF0F2;--gd:#B9BA5A;--ok:#1F7A4D;--okb:#EDF8F2;--okl:#BFE0CD;
--wn:#A66A12;--wnb:#FBF3E2;--wnl:#EBD5A6;--sh:0 1px 2px rgba(28,23,23,.05),0 5px 14px rgba(28,23,23,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--pg:#141010;--cd:#221C1B;--ln:#382F2E;--tx:#F5F1EF;--t2:#E6DEDB;--t3:#A29591;--t4:#7A6E6B;
--mr50:#3A1F26;--okb:#16261D;--okl:#2C4C3A;--wnb:#2A2116;--wnl:#4C3B20;--sh:0 1px 3px rgba(0,0,0,.45)}}
:root[data-theme=dark]{--pg:#141010;--cd:#221C1B;--ln:#382F2E;--tx:#F5F1EF;--t2:#E6DEDB;--t3:#A29591;--t4:#7A6E6B;
--mr50:#3A1F26;--okb:#16261D;--okl:#2C4C3A;--wnb:#2A2116;--wnl:#4C3B20;--sh:0 1px 3px rgba(0,0,0,.45)}
:root[data-theme=light]{--pg:#FAF8F7;--cd:#FFF;--ln:#EDE8E3;--tx:#1C1717;--t2:#2E2826;--t3:#857A75;--t4:#B0A6A0;
--mr50:#FBF0F2;--okb:#EDF8F2;--okl:#BFE0CD;--wnb:#FBF3E2;--wnl:#EBD5A6;--sh:0 1px 2px rgba(28,23,23,.05),0 5px 14px rgba(28,23,23,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--pg);color:var(--tx);display:flex;flex-direction:column;
font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}

.bar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px 11px;
border-bottom:1px solid var(--ln);background:var(--cd);z-index:400}
.gp{display:flex;gap:3px;padding:3px;background:var(--pg);border-radius:999px}
.tb{appearance:none;border:0;background:none;color:var(--t3);font:inherit;font-size:11.5px;font-weight:650;
padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tb[aria-pressed=true]{background:var(--mr);color:#fff}
.tb:focus-visible{outline:2px solid var(--mr);outline-offset:2px}
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;overflow:hidden}

/* iPhone 16 — 393 x 852pt, true proportions always; fitPhone() scales the whole frame */
.ph{width:100%;height:100%;background:var(--pg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:530px){
 .stage{padding:14px;overflow:hidden;align-items:center;justify-content:center}
 .ph{width:393px;height:852px;flex:0 0 auto;border-radius:44px;
   box-shadow:0 0 0 9px #1a1414,0 0 0 10px #3a3230,0 22px 50px rgba(28,23,23,.3)}
}
/* phone scroll region: NO visible scrollbar, ever */
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;
scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar{display:none;width:0;height:0}

.sbar{flex:0 0 auto;height:52px;background:var(--mr);display:flex;align-items:center;
justify-content:space-between;padding:14px 30px 0;position:relative;color:#fff;font-size:14px;font-weight:650}
.isl{position:absolute;left:50%;transform:translateX(-50%);top:9px;width:112px;height:31px;border-radius:999px;background:#100c0c}
.sbar .rt{display:flex;align-items:center;gap:5px}
.sbar .bat{width:22px;height:11px;border:1.4px solid rgba(255,255,255,.7);border-radius:3px;position:relative;display:inline-block}
.sbar .bat i{position:absolute;inset:1.5px;width:65%;background:#fff;border-radius:1px;display:block}
@media(max-width:529px){.sbar{display:none}}

.hd{flex:0 0 auto;background:var(--mr);padding:6px 18px 15px;display:flex;align-items:center;gap:11px}
.hd img.lg{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:#fff}
.hd .tt{flex:1;min-width:0}
.hd .st{font-size:10px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.55);text-transform:uppercase;
display:flex;align-items:center;gap:5px}
.hd .st svg{width:12px;height:12px;flex:0 0 auto}
.hd .wv{font-size:19px;line-height:23px;font-weight:700;letter-spacing:-.02em;color:#fff;margin-top:2px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;flex-direction:column;align-items:center;padding:5px 11px;border-radius:11px;
background:rgba(255,255,255,.14);flex:0 0 auto}
.pill .k{font-size:8.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.pill .v{font-size:15px;font-weight:700;color:#fff;line-height:17px}
.pill.urg{background:var(--gd)}.pill.urg .k{color:#4a4b12}.pill.urg .v{color:#2d2e08}

.seg{flex:0 0 auto;margin:10px 12px 0;background:var(--ln);border-radius:11px;padding:3px;display:flex;gap:3px}
.sg{flex:1;height:34px;border:0;border-radius:9px;background:none;font:inherit;font-size:13px;font-weight:650;
color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.sg[aria-pressed=true]{background:var(--cd);color:var(--tx);box-shadow:0 1px 3px rgba(28,23,23,.14)}
.sg .mini{font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:999px;background:var(--mr50);color:var(--mr)}

.prog{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--cd);border-bottom:1px solid var(--ln)}
.tr{flex:1;height:5px;border-radius:999px;background:var(--ln);overflow:hidden}
.tr i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.pc{font-size:11.5px;font-weight:650;color:var(--t3);white-space:nowrap}

/* badge with dot */
.bdot{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;padding:3px 8px;
border-radius:999px;background:var(--okb);color:var(--ok);border:1px solid var(--okl);white-space:nowrap}
.bdot i{width:6px;height:6px;border-radius:50%;background:currentColor}
.bdot.w{background:var(--wnb);color:var(--wn);border-color:var(--wnl)}
.bdot.m{background:var(--mr50);color:var(--mr);border-color:transparent}
.bdot.n{background:var(--pg);color:var(--t3);border-color:var(--ln)}
:root[data-theme=dark] .bdot.m{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bdot.m{color:#EBA3AF}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bdot.m i{animation:pulse 1.6s ease infinite}

.list{padding:12px;display:flex;flex-direction:column;gap:8px}
.c{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:11px;box-shadow:var(--sh)}
.c.ok{background:var(--okb);border-color:var(--okl);box-shadow:none}
.c.sh{background:var(--wnb);border-color:var(--wnl);box-shadow:none}
.top{display:flex;align-items:flex-start;gap:10px}
.th{width:46px;height:46px;border-radius:10px;flex:0 0 auto;object-fit:cover;background:var(--pg);border:1px solid var(--ln)}
.nb{flex:1;min-width:0}
.n1{font-size:15px;line-height:19px;font-weight:650;letter-spacing:-.012em;color:var(--t2);overflow-wrap:anywhere;text-wrap:pretty}
.n2{font-size:12.5px;line-height:16px;font-weight:450;color:var(--t3);overflow-wrap:anywhere;margin-top:1px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:6px}
.chip{font-size:10.5px;font-weight:700;padding:2.5px 7px;border-radius:6px;background:var(--pg);
border:1px solid var(--ln);color:var(--t2);white-space:nowrap}
.chip.at{background:var(--mr50);border-color:transparent;color:var(--mr)}
:root[data-theme=dark] .chip.at{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .chip.at{color:#EBA3AF}}
.oref{font-size:10.5px;font-weight:650;color:var(--t4);background:none;border:0;padding:2px;
font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.oref u{text-decoration:underline dotted;text-underline-offset:3px}
.qb{flex:0 0 auto;text-align:right;min-width:44px}
.qn{font-size:31px;line-height:31px;font-weight:700;letter-spacing:-.035em;color:var(--tx)}
.qu{font-size:10.5px;font-weight:650;color:var(--t3);margin-top:2px;white-space:nowrap}
.c.ok .qn{color:var(--ok)}.c.sh .qn{color:var(--wn)}
.ords{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln);display:flex;flex-wrap:wrap;gap:5px}
.ord{font-size:10.5px;font-weight:650;padding:3px 7px;border-radius:5px;background:var(--pg);border:1px solid var(--ln);color:var(--t3)}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;height:42px;border-radius:10px;border:none;font:inherit;font-size:13.5px;font-weight:650;cursor:pointer}
.b-ok{background:var(--ok);color:#fff}.b-ok:active{background:#195f3c}
.b-mr{background:var(--mr);color:#fff}.b-mr:active{background:var(--mr2)}
.b-sh{background:transparent;border:1.5px solid var(--wnl);color:var(--wn);flex:0 0 auto;padding:0 14px}.b-sh:active{background:var(--wnb)}
.stat{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;font-weight:650}
.dot{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot svg{width:10px;height:10px}
@keyframes dr{to{stroke-dashoffset:0}}
.dot.anim svg path{stroke-dasharray:26;stroke-dashoffset:26;animation:dr .45s cubic-bezier(.2,0,0,1) .04s forwards}

.fa{flex:0 0 auto;padding:8px 12px;background:var(--cd);border-top:1px solid var(--ln)}
.fb{width:100%;height:46px;border-radius:12px;border:0;background:var(--mr);color:#fff;font:inherit;font-size:14.5px;
font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fb svg{width:17px;height:17px}
.fb:disabled{background:var(--ln);color:var(--t4);cursor:not-allowed}

.nav{flex:0 0 auto;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding:4px 4px 0}
.nv{flex:1;height:44px;border:0;background:none;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:2px;color:var(--t4);font:inherit;font-size:9.5px;font-weight:550}
.nv[aria-current=page]{color:var(--mr);font-weight:700}
.nv svg{width:19px;height:19px}
.hbar{flex:0 0 auto;height:20px;display:flex;align-items:center;justify-content:center;background:var(--cd)}
.hbar i{width:132px;height:4.5px;border-radius:999px;background:var(--t4);opacity:.55}

.btn,.fb,.wb,.cir,.sg,.nv{transition:transform .09s ease,background .12s ease}
.btn:not(:disabled):active,.fb:not(:disabled):active,.wb:active,.cir:not(:disabled):active,.sg:active{transform:scale(.96)}

.off{flex:0 0 auto;background:#5B0F1B;color:#fff;padding:6px 16px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600}
.off svg{width:14px;height:14px;flex:0 0 auto}
.off .q{margin-left:auto;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:999px;font-size:10px}
.prov{flex:0 0 auto;background:var(--wnb);border-bottom:1px solid var(--wnl);padding:7px 16px;
font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--wn);
display:flex;align-items:center;gap:6px}
.prov svg{width:13px;height:13px;flex:0 0 auto}
.mt{padding:44px 30px;text-align:center}
.fi{width:64px;height:64px;border-radius:50%;background:var(--mr50);display:flex;align-items:center;
justify-content:center;margin:0 auto 14px;box-shadow:0 0 0 9px rgba(139,26,43,.045)}
.fi svg{width:27px;height:27px;color:var(--mr)}
.mt h4{font-size:17px;font-weight:700;margin:0 0 6px;color:var(--t2)}
.mt p{font-size:13px;color:var(--t3);margin:0;line-height:19px}

.pcard{margin:12px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.pid{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--ln)}
.pid img{width:44px;height:44px;border-radius:50%;background:#fff}
.pid b{font-size:15.5px;font-weight:700;display:block}
.pid span{font-size:11.5px;color:var(--t3);font-weight:550}
.prow{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--ln);
font-size:13.5px;font-weight:550;color:var(--t2);width:100%;background:none;border-left:0;border-right:0;border-top:0;
font-family:inherit;text-align:left;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow svg{width:17px;height:17px;color:var(--t3);flex:0 0 auto}
.prow .rv{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12.5px;font-weight:550}
.prow .rv svg{width:13px;height:13px;color:var(--t4)}
.sw{position:relative;width:46px;height:27px;border-radius:999px;background:var(--ln);border:0;cursor:pointer;
transition:background .18s ease;flex:0 0 auto;margin-left:auto}
.sw i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
box-shadow:0 1px 3px rgba(0,0,0,.28);transition:left .18s ease}
.sw[aria-checked=true]{background:var(--ok)}
.sw[aria-checked=true] i{left:21.5px}

/* price entry */
.pin{display:flex;align-items:center;gap:6px;height:38px;border:1.5px solid var(--ln);border-radius:9px;
padding:0 10px;background:var(--cd);max-width:130px}
.pin b{font-size:12.5px;color:var(--t3);font-weight:650}
.pin input{border:0;background:none;font:inherit;font-size:14px;font-weight:650;outline:0;width:100%;color:var(--tx)}
.pv{font-size:16px;font-weight:700;letter-spacing:-.01em}
.lockrow{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;color:var(--t4)}
.lockrow svg{width:11px;height:11px}

/* object threads — private notes between stall and office, pinned to the line */
.thr{margin-top:9px;border-top:1px dashed var(--ln);padding-top:9px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:92%;border-radius:10px;padding:7px 10px;font-size:12px;line-height:16px;
background:var(--pg);border:1px solid var(--ln);color:var(--t2);align-self:flex-start}
.bub .who{display:block;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
margin-bottom:2px;color:var(--t4)}
.bub.me{align-self:flex-end;background:var(--mr50);border-color:transparent}
.bub.me .who{color:var(--mr)}
:root[data-theme=dark] .bub.me .who{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .bub.me .who{color:#EBA3AF}}
.tin{display:flex;gap:6px;margin-top:2px}
.tin input{flex:1;height:36px;border:1px solid var(--ln);border-radius:9px;background:var(--cd);
padding:0 10px;font:inherit;font-size:12.5px;outline:0;color:var(--tx);min-width:0}
.tin button{height:36px;padding:0 14px;border-radius:9px;border:0;background:var(--mr);color:#fff;
font:inherit;font-size:12px;font-weight:650;cursor:pointer}
.plock{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t4);font-weight:600;margin-top:2px}
.plock svg{width:11px;height:11px;flex:0 0 auto}
.scrim{position:absolute;inset:0;background:rgba(28,23,23,.5);z-index:205}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--cd);border-radius:20px 20px 0 0;
padding:0 18px 26px;z-index:210;box-shadow:0 -8px 40px rgba(28,23,23,.22)}
.grab{width:32px;height:4px;border-radius:999px;background:var(--ln);margin:10px auto 14px}
.ey{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--t4);text-transform:uppercase;margin-bottom:6px;
display:flex;align-items:center;gap:5px}
.ey svg{width:12px;height:12px;flex:0 0 auto}
.step{background:var(--pg);border-radius:999px;height:56px;display:flex;align-items:center;padding:0 7px;gap:8px;margin:16px 0 14px}
.cir{width:42px;height:42px;border-radius:50%;background:var(--mr);border:0;cursor:pointer;color:#fff;
font-size:23px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cir:disabled{background:var(--t4)}
.sv{flex:1;text-align:center}.sv b{font-size:31px;font-weight:700;letter-spacing:-.03em}
.sv span{font-size:12px;font-weight:600;color:var(--t3);display:block;margin-top:1px}
.ack{margin:12px;background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:15px;box-shadow:var(--sh)}

.web{width:100%;height:100%;display:grid;grid-template-columns:212px 1fr 260px;overflow:hidden}
.web.np{grid-template-columns:212px 1fr}
@media(max-width:1000px){.web,.web.np{grid-template-columns:1fr}.sb,.rr{display:none}}
.sb{border-right:1px solid var(--ln);padding:14px 10px;background:var(--cd);overflow:auto}
.sb .lgw{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.sb .lgw img{width:32px;height:32px;border-radius:50%}
.sb .lgw b{font-size:12.5px;font-weight:700;color:var(--mr);line-height:15px}
.sb .gl{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--t4);
padding:11px 10px 4px;display:flex;align-items:center;gap:5px}
.sb .gl svg{width:11px;height:11px;flex:0 0 auto}
.sb a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:500;
color:var(--t2);text-decoration:none;cursor:pointer}
.sb a svg{width:16px;height:16px;flex:0 0 auto;color:var(--t3)}
.sb a[aria-current=page]{background:var(--mr50);color:var(--mr);font-weight:650}
.sb a[aria-current=page] svg{color:var(--mr)}
:root[data-theme=dark] .sb a[aria-current=page],:root[data-theme=dark] .sb a[aria-current=page] svg{color:#EBA3AF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .sb a[aria-current=page],
:root:not([data-theme=light]) .sb a[aria-current=page] svg{color:#EBA3AF}}
.mn{overflow:auto;padding:18px 22px 36px}
.h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
.h2{font-size:12px;color:var(--t3);margin:3px 0 0}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.srch{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border:1px solid var(--ln);
border-radius:9px;background:var(--cd);flex:1;max-width:250px;min-width:170px}
.srch svg{width:14px;height:14px;color:var(--t4);flex:0 0 auto}
.srch input{border:0;background:none;font:inherit;font-size:13px;outline:0;width:100%;color:var(--tx)}
.mcs{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:1240px){.mcs{grid-template-columns:repeat(2,1fr)}}
.mc{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.fi2{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:9px;
background:var(--mr50);color:var(--mr)}
.fi2.g{background:var(--okb);color:var(--ok)}.fi2.a{background:var(--wnb);color:var(--wn)}
.fi2 svg{width:15px;height:15px}
.mc b{font-size:21px;font-weight:700;letter-spacing:-.02em;display:block;line-height:24px}
.mc span{font-size:11px;color:var(--t3);font-weight:600}
.tbl{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--cd)}
.thd{display:flex;gap:12px;padding:8px 13px;border-bottom:1px solid var(--ln);background:var(--pg);
font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--t4)}
.rw{display:flex;align-items:center;gap:12px;padding:9px 13px;border-bottom:1px solid var(--ln);transition:background .1s}
.rw:hover{background:var(--pg)}
.rw:last-child{border-bottom:0}
.rw img{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:0 0 auto;border:1px solid var(--ln)}
.rw .q{font-size:18px;font-weight:700;min-width:36px;text-align:right}
.rw .qu2{font-size:10.5px;font-weight:650;color:var(--t3);min-width:52px}
.wb{height:32px;padding:0 12px;border-radius:8px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;border:none}
.wb svg{width:14px;height:14px;flex:0 0 auto}
.rr{border-left:1px solid var(--ln);padding:18px 15px;background:var(--cd);overflow:auto}
.rr h5{font-size:9.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--t4);margin:0 0 8px;
display:flex;align-items:center;gap:6px}
.rr h5 svg{width:13px;height:13px;flex:0 0 auto}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--ln)}
.steps{margin:2px 0 16px}
.stp{display:flex;gap:9px;position:relative;padding-bottom:13px}
.stp:last-child{padding-bottom:0}
.stp .ic{width:20px;height:20px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
background:var(--okb);color:var(--ok);border:1.5px solid var(--okl);z-index:1}
.stp .ic svg{width:10px;height:10px}
.stp.cur .ic{background:var(--mr);border-color:var(--mr);color:#fff}
.stp.fut .ic{background:var(--pg);border-color:var(--ln);color:var(--t4)}
.stp .ln2{position:absolute;left:9.25px;top:20px;bottom:-1px;width:1.5px;background:var(--ln)}
.stp b{font-size:12px;font-weight:650;display:block;line-height:15px}
.stp span{font-size:10.5px;color:var(--t3)}
.paper{background:#fff;color:#111;border:1px solid var(--ln);border-radius:10px;padding:22px 24px;max-width:560px;
box-shadow:var(--sh)}
.paper h3{font:700 15px/1.2 inherit;margin:0;letter-spacing:.02em}
.paper .ps{font-size:11.5px;color:#555;margin:3px 0 14px}
.prl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #bbb;font-size:13px}
.prl:last-child{border-bottom:0}
.pbx{width:14px;height:14px;border:1.6px solid #111;border-radius:3px;flex:0 0 auto}
.prl b{min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
.prl .pm{color:#666}
.prl .po{margin-left:auto;font-size:10.5px;color:#777;white-space:nowrap}
@media print{.bar,.sb,.rr,.hrow .wb{display:none!important}.web,.web.np{grid-template-columns:1fr}
.mn{padding:0}.paper{border:0;box-shadow:none;max-width:100%}}

function fillBadge(f){var okf=f==='100%';return '<span class="bdot'+(okf?'':' w')+'"><i></i>'+f+' filled</span>'}

   '<div class="acts"><button class="btn '+(c.st==='pending'?'b-ok':'b-mr')+'" data-adv="'+c.id+'">'+f.label+'</button>'+

function wToday(){
 var done=S.items.filter(isDone).length,ready=S.items.filter(function(i){return i.st==='ready'}).length;
 var inprog=S.items.filter(function(i){return i.st==='confirmed'||i.st==='packing'}).length;
 var shorts=S.items.filter(function(i){return i.st==='short'}).length;
 var q=S.q.toLowerCase();
 var items=S.items.filter(function(c){return !q||(c.en+' '+c.ms).toLowerCase().indexOf(q)>-1});
 var mn='<div class="mn"><div class="hrow"><div><div class="h1">11:00 slot</div>'+
  '<div class="h2">'+STORE+' · Fri 1 Aug · 2 orders · pack by 10:15</div></div>'+
  '<div class="srch">'+SVG.search+'<input id="q" placeholder="Search '+S.items.length+' lines" value="'+esc(S.q)+'"></div></div>'+
  '<div class="mcs">'+
  '<div class="mc"><div class="fi2">'+SVG.wave+'</div><b>'+S.items.length+'</b><span>Lines this slot</span></div>'+
  '<div class="mc"><div class="fi2 g">'+SVG.check+'</div><b>'+ready+'</b><span>Ready</span></div>'+
  '<div class="mc"><div class="fi2">'+SVG.handoff+'</div><b>'+inprog+'</b><span>In progress</span></div>'+
  '<div class="mc"><div class="fi2 a">'+SVG.alert+'</div><b>'+shorts+'</b><span>Short</span></div></div>'+
  '<div class="tbl"><div class="thd"><span style="width:38px"></span><span style="flex:1">Product</span>'+
  '<span style="min-width:36px;text-align:right">Qty</span><span style="min-width:120px">Status</span><span style="min-width:170px">Action</span></div>'+
  (items.length?items.map(function(c){
   var f=FLOW[c.st];
   return '<div class="rw">'+thumb(c,'')+'<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--t2)">'+esc(c.en)+
   (c.ms?' <span style="color:var(--t3);font-weight:400">'+esc(c.ms)+'</span>':'')+'</div>'+
   '<div style="font-size:11px;color:var(--t4);margin-top:2px">'+c.o.map(function(o){return '#'+o}).join(' ')+'</div></div>'+
   '<div class="q">'+(c.st==='short'?c.sq:c.q)+'</div>'+
   '<div style="min-width:120px">'+stBadge(c.st)+'</div>'+
   (f?'<div style="display:flex;gap:6px;min-width:170px"><button class="wb" style="background:'+(c.st==='pending'?'var(--ok)':'var(--mr)')+';color:#fff" data-adv="'+c.id+'">'+f.label+'</button><button class="wb" style="background:transparent;border:1.5px solid var(--wnl);color:var(--wn)" data-sh="'+c.id+'">Short</button></div>'
    :'<div style="min-width:170px;font-size:12px;font-weight:650;color:'+(c.st==='ready'?'var(--ok)':'var(--wn)')+'">'+(c.st==='ready'?'✓ Ready for collection':'! Short '+c.sq+' of '+c.q)+'</div>')+'</div>'}).join('')
  :'<div style="padding:26px;text-align:center;font-size:13px;color:var(--t3)">No lines match "'+esc(S.q)+'"</div>')+
  '</div></div>';
 var rr='<div class="rr"><h5>'+SVG.wave+'Slot progress</h5><div class="steps">'+
  '<div class="stp"><span class="ln2"></span><span class="ic">'+SVG.check+'</span><div><b>Orders closed</b><span>07:00</span></div></div>'+
  '<div class="stp cur"><span class="ln2"></span><span class="ic">'+SVG.dotc+'</span><div><b>Stall packing</b><span>'+ready+' of '+S.items.length+' ready</span></div></div>'+
  '<div class="stp fut"><span class="ln2"></span><span class="ic">'+SVG.dotc+'</span><div><b>List locks</b><span>10:15</span></div></div>'+
  '<div class="stp fut"><span class="ic">'+SVG.dotc+'</span><div><b>Runner collects</b><span>about 11:00</span></div></div></div>'+
  '<h5>'+SVG.next+'Next</h5><div class="kv"><span>14:00 slot</span><b>opens 12:30</b></div>'+
  '<button class="wb" style="background:var(--mr);color:#fff;width:100%;margin-top:13px;height:38px;display:flex;align-items:center;justify-content:center;gap:7px" data-wp="print">'+SVG.print+'Print pick list</button></div>';
 return mn+rr}

function wUpcoming(){
 var days={};UP.forEach(function(r){(days[r[0]]=days[r[0]]||[]).push(r)});
 return '<div class="mn"><div class="hrow"><div><div class="h1">Upcoming</div>'+
  '<div class="h2">'+STORE+' · next 3 days</div></div><span class="bdot w"><i></i>Provisional — numbers still grow</span></div>'+
  Object.keys(days).map(function(d){
   return '<div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t4);margin:14px 2px 7px">'+d+'</div>'+
   '<div class="tbl">'+days[d].map(function(r){var im=pic(r[1],r[2]);
    return '<div class="rw">'+(im?'<img src="'+im+'" alt="">':'<div style="width:38px"></div>')+
    '<div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--t2)">'+esc(r[1])+
    (r[2]?' <span style="color:var(--t3);font-weight:400">'+esc(r[2])+'</span>':'')+'</div></div>'+
    '<div class="q" style="color:var(--t3)">'+r[3]+'</div><div class="qu2">so far</div></div>'}).join('')+'</div>'}).join('')+
  '</div>'}

function wPrint(){
 var rows=S.items.map(function(c){
  return '<div class="prl"><span class="pbx"></span><b>'+c.q+'</b>'+
  '<span>'+esc(c.en)+(c.ms?' <span class="pm">/ '+esc(c.ms)+'</span>':'')+'</span>'+
  '<span class="po">'+c.o.map(function(o){return '#'+o}).join(' ')+'</span></div>'}).join('');
 return '<div class="mn"><div class="hrow"><div><div class="h1">Print pick list</div>'+
  '<div class="h2">A5 on the office mono printer — tick each line as you pack</div></div>'+
  '<button class="wb" style="background:var(--mr);color:#fff;height:36px;display:flex;align-items:center;gap:7px" data-pr="1">'+SVG.print+'Print</button></div>'+
  '<div class="paper"><h3>'+STORE.toUpperCase()+' — PICK LIST</h3>'+
  '<div class="ps">Fri 1 Aug · 11:00 slot · '+S.items.length+' lines · 2 orders · pack by 10:15</div>'+rows+
  '<div style="margin-top:14px;font-size:11px;color:#555">Short of anything? Tell the market office before 10:15.</div></div></div>'}

function wPrices(){
 return '<div class="mn"><div class="hrow"><div><div class="h1">Today’s prices</div>'+
  '<div class="h2">'+STORE+' · Fri 1 Aug · enter each day’s price once — today’s receipt uses today’s price · customer prices never appear here</div></div>'+
  '<span class="bdot n">'+'<i></i>'+Object.keys(S.prices).length+' of '+S.items.length+' set</span></div>'+
  '<div class="tbl"><div class="thd"><span style="width:38px"></span><span style="flex:1">Product</span>'+
  '<span style="min-width:130px">Your price</span><span style="min-width:190px">Status</span></div>'+
  S.items.map(function(c){var p=S.prices[c.id];
   return '<div class="rw">'+thumb(c,'')+'<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--t2)">'+esc(c.en)+
   (c.ms?' <span style="color:var(--t3);font-weight:400">'+esc(c.ms)+'</span>':'')+'</div></div>'+
   (p?'<div class="pv" style="min-width:130px">'+fmt(p.c)+'</div>'+
     '<div style="min-width:190px" class="lockrow">'+SVG.lock+'Locked — only the office can change</div>'
    :'<div style="min-width:130px">'+priceInput(c.id)+'</div>'+
     '<div style="min-width:190px"><button class="wb" style="background:var(--mr);color:#fff" data-psave="'+c.id+'">Save</button></div>')+
   '</div>'}).join('')+'</div>'+
  '<div style="margin-top:12px;font-size:12px;color:var(--t3)">A saved price applies to new orders only — old orders keep the price of their day.</div></div>'}

function wHistory(){
 return '<div class="mn"><div class="hrow"><div><div class="h1">History</div>'+
  '<div class="h2">'+STORE+' · past slots</div></div></div>'+
  '<div class="tbl"><div class="thd"><span style="flex:1">Date</span><span style="min-width:80px">Slot</span>'+
  '<span style="min-width:44px;text-align:right">Lines</span><span style="min-width:44px;text-align:right">Short</span>'+
  '<span style="min-width:96px;text-align:right">Fill rate</span></div>'+
  HIST.map(function(r){
   return '<div class="rw"><span style="flex:1;font-size:13.5px;font-weight:600;color:var(--t2)">'+r[0]+'</span>'+
   '<span style="min-width:80px;font-size:12.5px;color:var(--t3)">'+r[1]+'</span>'+
   '<span style="min-width:44px;text-align:right;font-weight:650">'+r[2]+'</span>'+
   '<span style="min-width:44px;text-align:right;font-weight:650;color:'+(r[3]?'var(--wn)':'var(--t4)')+'">'+r[3]+'</span>'+
   '<span style="min-width:96px;display:flex;justify-content:flex-end">'+fillBadge(r[4])+'</span></div>'}).join('')+
  '</div></div>'}

function wProfile(){
 return '<div class="mn"><div class="hrow"><div><div class="h1">Profile</div>'+
  '<div class="h2">'+STORE+' · stall settings</div></div></div>'+
  '<div class="pcard" style="margin:0;max-width:470px"><div class="pid"><img src="'+LOGO+'" alt=""><div><b>'+STORE+'</b>'+
  '<span>Pasar Geylang Serai · dry goods</span></div></div>'+
  '<div class="prow" style="cursor:default">'+SVG.check+'Accepting orders<button class="sw" data-sw="1" aria-checked="'+S.accept+'" aria-label="Accepting orders"><i></i></button></div>'+
  '<button class="prow" data-wp2="prices">'+SVG.tag+'Prices<span class="rv">'+Object.keys(S.prices).length+' of '+S.items.length+' set '+SVG.chev+'</span></button>'+
  '<button class="prow">'+SVG.upcoming+'Prep time<span class="rv">45 min '+SVG.chev+'</span></button>'+
  '<button class="prow">'+SVG.today+'Opening days<span class="rv">Tue – Sun '+SVG.chev+'</span></button>'+
  '<button class="prow">'+SVG.globe+'Language<span class="rv">English · Melayu '+SVG.chev+'</span></button></div>'+
  '<div style="margin-top:12px;font-size:12px;color:var(--t3)">Only the stall’s own price to the market is shown on vendor surfaces. Customer prices and margins never are.</div></div>'}

function web(){
 var page={today:wToday,upcoming:wUpcoming,print:wPrint,prices:wPrices,settle:wSettle,history:wHistory,profile:wProfile}[S.wpage]();
 return '<div class="web'+(S.wpage==='today'?'':' np')+'">'+wSidebar()+page+'</div>'}

/* ---------- office (admin) view ---------- */
function admin(){
 var set=Object.keys(S.prices).length;
 var rows=S.items.map(function(c){
  var p=S.prices[c.id],sell=SELL[c.id],editing=S.pedit[c.id];
  var costCell,statusCell;
  if(p&&!editing){
   costCell='<div class="pv" style="min-width:110px">'+fmt(p.c)+'</div>';
   statusCell='<div style="min-width:170px;display:flex;align-items:center;gap:8px">'+
    '<span class="bdot '+(p.by==='stall'?'n':'m')+'"><i></i>set by '+(p.by==='stall'?'stall':'office')+'</span>'+
    '<button class="wb" style="background:transparent;border:1px solid var(--ln);color:var(--t2);display:flex;align-items:center;gap:5px" data-pedit="'+c.id+'">'+SVG.pen+'Change</button></div>';
  }else{
   costCell='<div style="min-width:110px">'+priceInput(c.id,p?(p.c/100).toFixed(2):'0.00')+'</div>';
   statusCell='<div style="min-width:170px"><button class="wb" style="background:var(--mr);color:#fff" data-psave="'+c.id+'">Save</button>'+
    (editing?' <button class="wb" style="background:transparent;border:1px solid var(--ln);color:var(--t3)" data-pcancel="'+c.id+'">Cancel</button>':'')+'</div>';
  }
  var margin=p?Math.round((sell-p.c)/sell*100):null;
  return '<div class="rw">'+thumb(c,'')+
   '<div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--t2)">'+esc(c.en)+
   (c.ms?' <span style="color:var(--t3);font-weight:400">'+esc(c.ms)+'</span>':'')+'</div></div>'+
   costCell+
   '<div style="min-width:70px;font-size:13.5px;font-weight:650">'+fmt(sell)+'</div>'+
   '<div style="min-width:64px">'+(margin===null?'<span style="color:var(--t4);font-size:12px">—</span>'
     :'<span class="bdot'+(margin<25?' w':'')+'"><i></i>'+margin+'%</span>')+'</div>'+
   statusCell+'</div>'}).join('');
 return '<div class="web np"><div class="sb"><div class="lgw"><img src="'+LOGO+'" alt=""><b>Geylang Serai<br>Office</b></div>'+
  '<div class="gl">'+SVG.tag+'Catalogue</div><a aria-current="page">'+SVG.tag+'Stall prices</a></div>'+
  '<div class="mn"><div class="hrow"><div><div class="h1">Stall prices — '+STORE+'</div>'+
  '<div class="h2">'+set+' of '+S.items.length+' set · stalls enter once, the office can change any time · new prices apply to new orders only</div></div></div>'+
  '<div class="tbl"><div class="thd"><span style="width:38px"></span><span style="flex:1">Product</span>'+
  '<span style="min-width:110px">Stall price</span><span style="min-width:70px">Shop price</span>'+
  '<span style="min-width:64px">Margin</span><span style="min-width:170px"></span></div>'+rows+'</div>'+
  '<div style="margin-top:12px;font-size:12px;color:var(--t3)">Margin is visible only here. Vendor surfaces show the stall’s own price and nothing else.</div></div></div>'}

function fitPhone(){
 var p=document.querySelector('.ph');if(!p)return;
 if(window.innerWidth<530){p.style.zoom='';return}
 var st=document.getElementById('stage');
 var s=Math.min(1,(st.clientHeight-52)/852,(st.clientWidth-52)/393);
 p.style.zoom=s>0?s:1;
}
function render(){
 document.getElementById('stage').innerHTML=S.view==='mobile'?mobile():S.view==='web'?web():admin();
 document.querySelectorAll('[data-v]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.v===S.view)});
 document.querySelectorAll('[data-s]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.s===S.screen)});
 mchips.style.display=S.view==='mobile'?'flex':'none';
 offBtn.style.display=S.view==='mobile'?'':'none';
 offBtn.setAttribute('aria-pressed',S.off);thBtn.setAttribute('aria-pressed',S.dark);
 fitPhone();
}
window.addEventListener('resize',fitPhone);
function refocus(id){var el=document.getElementById(id);
 if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
document.addEventListener('input',function(e){
 if(e.target.id==='q'){S.q=e.target.value;render();refocus('q')}
 else if(e.target.dataset&&e.target.dataset.pid!==undefined){
  S.pin[e.target.dataset.pid]=e.target.value.replace(/[^0-9.]/g,'');render();refocus(e.target.id)}
 else if(e.target.dataset&&e.target.dataset.vtid!==undefined){
  S.vtin[e.target.dataset.vtid]=e.target.value;render();refocus(e.target.id)}
});
document.addEventListener('click',function(e){
 if(e.target.classList.contains('scrim')){S.sheet=null;return render()}
 var t=e.target.closest('button,a[data-wp]');if(!t)return;var d=t.dataset;
 if(d.v){S.view=d.v}
 else if(d.s){S.screen=d.s;S.nav=(d.s==='ack'||d.s==='empty')?'today':(d.s==='prices'||d.s==='settle')?'profile':d.s;S.sheet=null}
 else if(d.rx!==undefined){S.rx[d.rx]=!S.rx[d.rx]}
 else if(d.s2){S.screen=d.s2;S.nav='profile'}
 else if(t.id==='offBtn'){S.off=!S.off}
 else if(t.id==='thBtn'){S.dark=!S.dark;document.documentElement.setAttribute('data-theme',S.dark?'dark':'light')}
 else if(d.nav){S.nav=d.nav;S.screen=d.nav;S.sheet=null}
 else if(d.wp){S.wpage=d.wp}
 else if(d.wp2){S.wpage=d.wp2}
 else if(d.wv){S.wv=d.wv}
 else if(d.sw){S.accept=!S.accept}
 else if(d.pr){window.print();return}
 else if(d.exp){S.exp[d.exp]=!S.exp[d.exp]}
 else if(d.adv!==undefined){var c=S.items[d.adv];var f=FLOW[c.st];
  if(f){c.st=f.next;if(c.st==='ready')S.lastOk=+d.adv}}
 else if(d.sh!==undefined){S.sheet=+d.sh;S.sq=Math.max(0,S.items[+d.sh].q-1)}
 else if(d.ack){S.acked=d.ack}
 else if(d.d){S.sq=Math.min(S.items[S.sheet].q,Math.max(0,S.sq+ +d.d))}
 else if(d.cs){var i=S.items[S.sheet];i.st='short';i.sq=S.sq;S.sheet=null;
  VTHR[i.id]=[{by:'me',who:'You · '+STORE,t:'09:56',txt:'Short — '+S.sq+' of '+i.q+' only. Sent to office.'},
   {by:'of',who:'Office',t:'09:58',txt:'Noted — send what you have, we adjust the customer side. Jangan risau.'}];
  S.vth[i.id]=true}
 else if(d.vth!==undefined){S.vth[d.vth]=!S.vth[d.vth]}
 else if(d.vtsend!==undefined){var vv=(S.vtin[d.vtsend]||'').trim();
  if(vv){(VTHR[d.vtsend]=VTHR[d.vtsend]||[]).push({by:'me',who:'You · '+STORE,t:'10:02',txt:vv});
   delete S.vtin[d.vtsend]}}
 else if(d.psave!==undefined){var val=parseFloat(S.pin[d.psave]);
  if(val>0){S.prices[d.psave]={c:Math.round(val*100),by:S.view==='admin'?'office':'stall'};
   delete S.pin[d.psave];delete S.pedit[d.psave]}}
 else if(d.pedit!==undefined){S.pedit[d.pedit]=true;S.pin[d.pedit]=(S.prices[d.pedit].c/100).toFixed(2)}
 else if(d.pcancel!==undefined){delete S.pedit[d.pcancel];delete S.pin[d.pcancel]}
 else return;
 render()});
render();
</script>
